  <style>
    .overflow-scroll::-webkit-scrollbar {
        display: none;
    }
    .overflow-scroll {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }

    :root {
      --vt-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    nav {
      view-transition-name: site-nav;
    }

    #back-home {
      view-transition-name: btn-back;
    }

    #share-recipe {
      view-transition-name: btn-share;
    }

    .btn-round:focus-visible {
      outline: 2px solid #F53200;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: no-preference) {
      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root) {
        animation-duration: 180ms;
        animation-timing-function: var(--vt-ease);
      }
      ::view-transition-new(root) {
        animation-name: vt-content-in;
        animation-duration: 280ms;
        animation-timing-function: var(--vt-ease);
      }
      :root:active-view-transition-type(forward) ::view-transition-new(root) {
        animation-name: vt-in-forward;
      }
      :root:active-view-transition-type(back) ::view-transition-new(root) {
        animation-name: vt-in-back;
      }
      ::view-transition-group(.vt-image) {
        animation-timing-function: var(--vt-ease);
      }
    }

    @keyframes vt-content-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes vt-in-forward {
      from {
        opacity: 0;
        transform: translateX(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes vt-in-back {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .btn-round {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: none;
      border-radius: 9999px;
      color: #F53200;
      box-shadow: 0 1px 4px rgba(67, 20, 7, .18);
      text-decoration: none;
      cursor: pointer;
      transition: background 150ms ease, opacity 250ms ease;
    }
    .btn-round:hover {
      background: #FFEDD5;
    }
    .btn-round svg {
      width: 20px;
      height: 20px;
    }
    .btn-round.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script>
    (function () {
      var NAME = "recipe-image";
      var VCLASS = "vt-image";
      var BACK_KEY = "msVtRecipeBack";
      var DIR_KEY = "msVtDir";
      var clickedCard = null;

      function isRecipePath(pathname) {
        return pathname.indexOf("/recipes/") === 0;
      }

      function pathOf(url) {
        return new URL(url, location.href).pathname;
      }

      function tagImage(el) {
        if (!el) return;
        el.style.viewTransitionName = NAME;
        try { el.style.setProperty("view-transition-class", VCLASS); } catch (err) {}
      }

      function untagImage(el) {
        if (!el) return;
        el.style.viewTransitionName = "";
        try { el.style.removeProperty("view-transition-class"); } catch (err) {}
      }

      document.addEventListener("click", function (e) {
        clickedCard = e.target && e.target.closest ? e.target.closest("a.recipe[href]") : null;
      }, true);

      window.addEventListener("pageswap", function (e) {
        if (!e.viewTransition || !e.activation) return;
        var dest = new URL(e.activation.entry.url, location.href);
        if (dest.origin !== location.origin) return;

        try {
          e.viewTransition.types.add(e.activation.navigationType === "traverse" ? "back" : "forward");
          sessionStorage.setItem(DIR_KEY, e.activation.navigationType === "traverse" ? "traverse" : "push");
        } catch (err) {}

        if (isRecipePath(location.pathname)) {
          var hero = document.querySelector(".image img.view");
          tagImage(hero);
          try { sessionStorage.setItem(BACK_KEY, location.pathname); } catch (err) {}
          return;
        }

        if (isRecipePath(dest.pathname) && clickedCard && pathOf(clickedCard.href) === dest.pathname) {
          var img = clickedCard.querySelector("img");
          tagImage(img);
        }
      });

      window.addEventListener("pagereveal", function (e) {
        if (!e.viewTransition) return;
        var dir = null;
        try {
          if (window.navigation && window.navigation.activation && window.navigation.activation.navigationType) {
            dir = window.navigation.activation.navigationType;
          } else {
            dir = sessionStorage.getItem(DIR_KEY);
            sessionStorage.removeItem(DIR_KEY);
          }
        } catch (err) {}
        if (dir === "traverse" || dir === "push") {
          e.viewTransition.types.add(dir === "traverse" ? "back" : "forward");
        }

        if (isRecipePath(location.pathname)) {
          var hero = document.querySelector(".image img.view");
          if (hero) {
            tagImage(hero);
            e.viewTransition.finished.then(function () {
              untagImage(hero);
            });
          }
          return;
        }
        var from = null;
        try {
          from = sessionStorage.getItem(BACK_KEY);
          sessionStorage.removeItem(BACK_KEY);
        } catch (err) {}
        if (from) {
          var cards = document.querySelectorAll("a.recipe[href]");
          for (var i = 0; i < cards.length; i++) {
            if (pathOf(cards[i].href) === from) {
              var img = cards[i].querySelector("img");
              if (img) {
                tagImage(img);
                e.viewTransition.finished.then(function (el) {
                  return function () { untagImage(el); };
                }(img));
              }
              break;
            }
          }
        }
      });
    })();
  </script>

  <script type="speculationrules">
    {
      "prefetch": [
        {
          "source": "document",
          "where": { "href_matches": "/recipes/*" },
          "eagerness": "moderate"
        }
      ]
    }
  </script>

  <script>
    (function () {
      var supportsRules = false;
      try {
        supportsRules = !!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports("speculationrules"));
      } catch (err) {}
      if (supportsRules || typeof fetch !== "function") return;
      var done = {};
      function prefetch(href) {
        var u;
        try { u = new URL(href, location.href); } catch (err) { return; }
        if (u.origin !== location.origin) return;
        if (u.pathname.indexOf("/recipes/") !== 0 || done[u.pathname]) return;
        done[u.pathname] = true;
        try { fetch(u.href, { credentials: "same-origin" }).catch(function () {}); } catch (err) {}
      }
      ["pointerover", "touchstart"].forEach(function (type) {
        document.addEventListener(type, function (e) {
          var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
          if (a) prefetch(a.href);
        }, { passive: true, capture: true });
      });
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
    navigator.serviceWorker
      .register("{{ site.baseurl }}/serviceworker.js", {
        scope: "./"
      })
      .then(function (reg) {
        // Prüfe alle 24h auf Updates
        setInterval(function() {
          reg.update();
        }, 24 * 60 * 60 * 1000);
      });
  }
  </script>

  <script>
    // Scrollposition pro Seite innerhalb der Tab-Session merken, damit
    // Zurueck-Navigation (Startseite/Suche -> Rezept -> Zurueck) dort
    // weitermacht, wo man war (die Seite scrollt im #content-Container,
    // nicht im Fenster - deshalb stellt der Browser nichts von selbst her).
    (function () {
      var KEY = "msScrollPos";
      function read() {
        try { return JSON.parse(sessionStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
      }
      function save() {
        var c = document.getElementById("content") || document.querySelector(".content");
        if (!c) return;
        var d = read();
        d[location.pathname] = c.scrollTop;
        try { sessionStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
      }
      function restore() {
        var c = document.getElementById("content") || document.querySelector(".content");
        if (!c) return;
        // Nur bei Zurueck/Vorwaerts-Navigation und Reload wiederherstellen;
        // frische Klicks (z. B. Nav-Link) starten oben.
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        var type = nav ? nav.type : "navigate";
        if (type !== "back_forward" && type !== "reload") return;
        var y = read()[location.pathname] || 0;
        if (!y) return;
        var attempts = 0;
        (function apply() {
          c.scrollTop = y;
          if (Math.abs(c.scrollTop - y) > 2 && attempts++ < 120) requestAnimationFrame(apply);
        })();
      }
      window.addEventListener("pagehide", save);
      window.addEventListener("pageshow", function (e) { if (!e.persisted) restore(); });
    })();
  </script>
