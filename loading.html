---
layout: none
---
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F53200">
  <meta name="robots" content="noindex">
  <title>Lädt... · Mundschmaus</title>
  <style>
    :root {
      --orange: #F53200;
      --bg: #FFF7ED;
      --ink: #431407;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .loading-icon {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
    }
    .pot {
      position: absolute;
      width: 72px;
      height: 48px;
      background: var(--orange);
      border-radius: 0 0 36px 36px;
      bottom: 0;
      left: 0;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .pot::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 8px;
      background: #fff;
      border-radius: 4px;
      top: 8px;
      left: 12px;
    }
    .pot::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 8px;
      background: #fff;
      border-radius: 4px;
      top: 8px;
      right: 12px;
    }
    .spoon {
      position: absolute;
      width: 32px;
      height: 8px;
      background: #fff;
      border-radius: 4px;
      right: -8px;
      top: 16px;
      transform-origin: left center;
      animation: stir 2.4s ease-in-out infinite;
    }
    .spoon::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 4px;
      background: #fff;
      border-radius: 2px;
      right: -16px;
      top: -2px;
    }
    @keyframes stir {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spoon { animation: none; transform: rotate(0deg); }
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 700;
      margin: 0 0 10px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: .72;
      max-width: 36ch;
    }
    footer {
      position: relative;
      text-align: center;
      font-size: 12px;
      opacity: .4;
      padding: 24px 0;
      user-select: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="loading-icon" aria-label="Lädt">
      <div class="pot"></div>
      <div class="spoon"></div>
    </div>
    <h1 id="loading-text">Lädt...</h1>
    <p>Einen Moment, wir bereiten alles vor.</p>
  </main>
  <footer>mundschmaus.de</footer>
  <script>
    const messages = [
      "Wir kochen deine Rezepte...",
      "Der Ofen heizt sich auf...",
      "Geduld ist eine Zutat...",
      "Wir schneiden gerade die Zutaten...",
      "Der Topf dampft schon...",
      "Fast fertig – wie ein guter Braten...",
      "Wir rühren kräftig um...",
      "Die Zutaten mischen sich...",
      "Gleich servierfertig...",
      "Wir würzen nach Geschmack..."
    ];
    
    function getRandomMessage() {
      const randomIndex = Math.floor(Math.random() * messages.length);
      return messages[randomIndex];
    }
    
    document.getElementById('loading-text').textContent = getRandomMessage();
  </script>
</body>
</html>
